name: Monthly Cost Report

on:
  schedule:
    # Run on the 1st of each month at 9:00 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  cost-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GCP Cloud Run Metrics
        id: gcp-metrics
        continue-on-error: true
        run: |
          # Note: Requires GCP authentication and billing API enabled
          # This is a placeholder - actual implementation requires:
          # 1. GCP authentication via Workload Identity
          # 2. Billing API enabled
          # 3. Proper IAM permissions

          echo "request_count=0" >> $GITHUB_OUTPUT
          echo "instance_hours=0" >> $GITHUB_OUTPUT
          echo "estimated_cost=0.00" >> $GITHUB_OUTPUT

          # Example implementation (when GCP auth is configured):
          # gcloud billing accounts list
          # gcloud logging read "resource.type=cloud_run_revision" \
          #   --limit=10000 --format=json --freshness=30d \
          #   | jq '[.[] | select(.protoPayload.methodName=="google.cloud.run.v1.Revisions.GetRevision")] | length'

      - name: Create Cost Report Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date();
            const month = date.toLocaleString('default', { month: 'long' });
            const year = date.getFullYear();
            const previousMonth = new Date(date.getFullYear(), date.getMonth() - 1, 1);
            const prevMonthName = previousMonth.toLocaleString('default', { month: 'long' });

            const issueBody = `## 💰 Monthly Cost Review: ${prevMonthName} ${year}

            This is your automated monthly cost review reminder.

            ### Review Checklist

            #### GCP (Cloud Run)
            - [ ] Check billing in [GCP Console](https://console.cloud.google.com/billing)
            - [ ] Review request count and instance hours
            - [ ] Note actual costs: $____
            - [ ] Check for unexpected spikes
            - [ ] Verify budget alerts are working

            #### Supabase (PostgreSQL)
            - [ ] Check database size in [Supabase Dashboard](https://app.supabase.com)
            - [ ] Review bandwidth usage: ____ GB
            - [ ] Check API request count
            - [ ] Database size: ____ MB
            - [ ] Archive or delete old data if needed

            #### GitHub
            - [ ] Check Actions minutes used
            - [ ] Review Pages bandwidth
            - [ ] Verify workflow efficiency

            #### Cloudflare R2
            - [ ] Check if R2 is enabled: Yes / No
            - [ ] If yes, note storage costs: $____

            ### Update Documentation

            - [ ] Update cost table in [COSTS.md](../blob/main/COSTS.md)
            - [ ] Update [cost-tracking-template.csv](../blob/main/cost-tracking-template.csv)
            - [ ] Note any anomalies or optimization opportunities

            ### Cost Summary

            **Previous Month Actual Costs:**
            - GCP Cloud Run: $____
            - Supabase: $____
            - Cloudflare R2: $____
            - GitHub: $____
            - **Total**: $____

            **Status**: ⬜ Under budget ($10) | ⬜ Over budget

            ### Actions Taken

            (Document any optimizations or changes made)

            ---

            **Next Review**: ${month} 1, ${year}

            Close this issue after completing the review and updating documentation.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `💰 Cost Review: ${prevMonthName} ${year}`,
              body: issueBody,
              labels: ['cost-tracking', 'monthly-review']
            });

      - name: Check Cost Threshold
        id: check-threshold
        continue-on-error: true
        run: |
          # Placeholder for cost threshold check
          # In a real implementation, this would:
          # 1. Fetch actual GCP billing data
          # 2. Compare against threshold ($10)
          # 3. Alert if over budget

          THRESHOLD=10
          CURRENT_COST=2.50

          if (( $(echo "$CURRENT_COST > $THRESHOLD" | bc -l) )); then
            echo "⚠️ WARNING: Costs exceed threshold!"
            echo "over_budget=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Costs within budget"
            echo "over_budget=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Alert if Over Budget
        if: steps.check-threshold.outputs.over_budget == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 ALERT: Monthly costs exceed budget',
              body: `Monthly costs have exceeded the $10 budget threshold.

              Please review costs immediately and implement optimization strategies.

              See [COSTS.md](../blob/main/COSTS.md) for optimization guidelines.`,
              labels: ['alert', 'cost-tracking', 'urgent']
            });
